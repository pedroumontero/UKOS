# Escucha en Tailscale y LAN; bind-dynamic evita fallo al arrancar si la IP TS aún no existe.
bind-dynamic
interface=tailscale0
interface=enp6s18
no-resolv
no-poll
cache-size=256
# Avoid AAAA REFUSED confusing systemd-resolved (treats mixed success/refused as failure).
filter-AAAA
# Prefer TS vs LAN A-record by source interface when multiple address= lines exist.
localise-queries
# Authoritative for these zones so non-A queries return NODATA (not REFUSED) to strict resolvers.
local=/ukos.tech/
local=/dev-ukos.tech/
