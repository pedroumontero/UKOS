# UKOS en modo desarrollo (hot reload) en puerto 3001, sin tocar ukos-app :3000.
# Misma red y misma DB que producción (servicio `db` / ukos-db).
#
# Arrancar:  docker compose -f docker-compose.dev-remote.yml up -d --build
# Parar:     docker compose -f docker-compose.dev-remote.yml down
# Logs:      docker compose -f docker-compose.dev-remote.yml logs -f app-dev
#
# Entrar con Tailscale (recomendado):
#   https://dev-ukos.tech
# O por IP tailnet:
#   http://100.71.178.53:3001
#
# Usa https://dev-ukos.tech en el navegador. NEXTAUTH_URL debe coincidir con la URL que pongas en el navegador; por defecto https://dev-ukos.tech (Split DNS).
# Si solo usarás la IP tailnet sin nombre: http://100.71.178.53:3001 (sin Caddy TLS).

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ukos-app-dev
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 10g
    memswap_limit: 14g
    # Docker suele heredar resolv.conf del host; con Tailscale / DNS interno a veces falla la resolución
    # hacia Internet dentro del contenedor (EAI_AGAIN → OpenAI "Connection error"). Forzar DNS públicos.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ukos:ukos@db:5432/ukos?schema=public
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${UKOS_DEV_URL:-https://dev-ukos.tech}
      NEXT_PUBLIC_NEXTAUTH_URL: ${UKOS_DEV_URL:-https://dev-ukos.tech}
      APP_URL: ${UKOS_DEV_URL:-https://dev-ukos.tech}
      DEFAULT_COMPANY_SLUG: ${DEFAULT_COMPANY_SLUG:-ukos-demo}
      # Preferir IPv4 si el host tiene AAAA roto hacia salida.
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Bind mount host→contenedor: inotify no siempre dispara; webpack+polling detecta guardados reales.
      WATCHPACK_POLLING: "1"
      CHOKIDAR_USEPOLLING: "1"
      # Intervalo de polling (ms): más alto = menos falsos “Compiling…” y menos CPU; un poco más lento al detectar guardados.
      UKOS_DEV_POLL_MS: "2500"
      # Precalentamiento en background (scripts/warm-next-dev.mjs). En VMs con poca CPU puede competir con la 1ª compilación:
      # dejar en 0 por defecto; poner UKOS_DEV_WARM=1 cuando quieras tras reinicio (espera ~25s + colas de compilación).
      UKOS_DEV_WARM: "0"
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - ukos-app-dev-node-modules:/app/node_modules
    command: ["sh", "scripts/dev-docker-entry.sh"]
    networks:
      - ukos_default

networks:
  ukos_default:
    external: true

volumes:
  ukos-app-dev-node-modules:
