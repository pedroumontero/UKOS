# Desarrollo local con codigo montado y hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    build:
      target: dev
    environment:
      WATCHPACK_POLLING: "1"
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev:docker"
