# Desarrollo local con codigo montado y hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    build:
      target: dev
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
      WATCHPACK_POLLING: "1"
      CHOKIDAR_USEPOLLING: "1"
      UKOS_DEV_POLL_MS: "1500"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "scripts/dev-docker-entry.sh"]
